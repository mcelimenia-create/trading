name: trader-bot

on:
  # Las tareas las lanza el Worker de Cloudflare (cron cada 5 minutos) con workflow_dispatch.
  workflow_dispatch:
    inputs:
      job:
        description: "Tarea a ejecutar"
        type: choice
        default: news
        options: [news, session, paper, candidates, scan]

permissions:
  contents: write

concurrency:
  group: trader-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado cifrado (rama state)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: bash scripts/sync_state.sh restore

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TRADER_DIR: ${{ runner.temp }}/bot-state/trader
        run: python3 scripts/trader_bot.py "$JOB"

      - name: Publicar panel (docs/data)
        if: always() && !cancelled() && (env.JOB == 'news' || env.JOB == 'session' || env.JOB == 'paper' || env.JOB == 'candidates')
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: actualizar panel (${JOB})"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Guardar estado cifrado (rama state)
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: bash scripts/sync_state.sh save
